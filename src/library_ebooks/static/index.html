<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Library Ebooks</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <h1>Library Ebooks</h1>
  <p>Converte PDF em EPUB, corrige hifenização, traduz e revisa gramática.</p>

  <div id="dropzone">
    <p>Arraste um PDF aqui, ou <button type="button" id="browse-button">escolha um arquivo</button></p>
    <input type="file" id="file-input" accept=".pdf" hidden />
    <p id="selected-file"></p>
  </div>

  <form id="options-form">
    <label>
      Idioma do livro (pra corrigir hifenização)
      <select id="book-lang">
        <option value="">não corrigir por dicionário</option>
        <option value="pt">Português</option>
        <option value="es">Espanhol</option>
        <option value="en">Inglês</option>
      </select>
    </label>

    <label>
      Traduzir para
      <select id="translate-to">
        <option value="">não traduzir</option>
        <option value="pt">Português</option>
        <option value="es">Espanhol</option>
        <option value="en">Inglês</option>
      </select>
    </label>

    <label>
      <input type="checkbox" id="generate-azw3" />
      Gerar também AZW3 (Kindle)
    </label>

    <label>
      <input type="checkbox" id="check-grammar" />
      Verificar e corrigir gramática (requer idioma do livro selecionado acima)
    </label>

    <button type="submit" id="convert-button">Converter</button>
  </form>

  <p id="progress"></p>
  <div id="result"></div>

  <script src="/app.js"></script>
</body>
</html>
