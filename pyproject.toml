[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "library-ebooks"
version = "0.1.0"
description = "Converte PDFs em EPUB/AZW3, corrige hifenização quebrada e traduz livros offline."
requires-python = ">=3.11"
dependencies = [
    "pyenchant>=3.2",
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12",
    "argostranslate>=1.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/library_ebooks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
